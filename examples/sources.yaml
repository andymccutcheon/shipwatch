# Sample source pack (~26 well-known AI and developer-tool changelogs).
# URLs were fetched successfully on 2026-10-11 with the shipwatch user agent.
# Prefer RSS/Atom and GitHub Releases; HTML pages are a fallback and may be
# thin when a site is client-rendered.
#
# Edit freely. Disable a row with enabled: false.

sources:
  - id: openai-news
    name: OpenAI News
    kind: rss
    url: https://openai.com/news/rss.xml
    tags: [openai, models]

  - id: openai-api
    name: OpenAI API Changelog
    kind: html
    url: https://developers.openai.com/api/docs/changelog
    tags: [openai, api]

  - id: anthropic-news
    name: Anthropic News
    kind: html
    url: https://www.anthropic.com/news
    tags: [anthropic, models]

  - id: anthropic-release-notes
    name: Anthropic Release Notes
    kind: html
    url: https://docs.anthropic.com/en/release-notes/overview
    tags: [anthropic, api]
    notes: Redirects to platform.claude.com as of 2026-10-11.

  - id: google-ai-blog
    name: Google AI Blog
    kind: rss
    url: https://blog.google/technology/ai/rss/
    tags: [google, gemini]

  - id: gemini-api
    name: Gemini API Changelog
    kind: html
    url: https://ai.google.dev/gemini-api/docs/changelog
    tags: [google, api]

  - id: gemini-docs-sitemap
    name: Gemini docs (new pages)
    kind: sitemap
    url: https://ai.google.dev/sitemap.xml
    tags: [google, docs]
    notes: Optional new-page detector. High volume; disable if noisy.

  - id: mistral-news
    name: Mistral News
    kind: rss
    url: https://mistral.ai/news/rss
    tags: [mistral, models]

  - id: cursor
    name: Cursor Changelog
