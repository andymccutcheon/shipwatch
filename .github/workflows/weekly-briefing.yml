name: Weekly briefing

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shipwatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Init config if needed
        run: |
          if [ ! -f shipwatch.yaml ]; then
            shipwatch init
          fi
      - name: Fetch and brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shipwatch --no-llm run --since 7d --out briefs --html
      - name: Commit briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs
          if git diff --staged --quiet; then
            echo "No briefing changes"
          else
            git commit -m "chore: weekly shipwatch briefing"
            git push
          fi
